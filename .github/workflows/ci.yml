name: "CI"
on:
  pull_request:
  push:
    branches:
      - "**"
      - "released"

jobs:
  do-it:
    name: Simple tests (${{ matrix.nix }}/${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        nix:
          - none
          - lix-gha-installer-action
        os: # https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - macos-13 # Last x86_64
          - macos-14 # aarch64
          - macos-15 # aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Testing BYO nix.
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        if: ${{ matrix.nix == 'none' }}

      - name: Test this action...
        uses: ./
        with:
          installer-action: ${{ matrix.nix }}

      - uses: ./.github/workflows/extra-info.yml
